# fly.toml — Fly.io config for the Sunwoven app (API + client in one container).
# Deploy:  fly deploy --remote-only
# Rename `app` to whatever you called it in `fly launch`.

app = "sunwoven"
primary_region = "iad"

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
